[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-sarvam-integration"
version = "0.1.4"
description = "Integration of Sarvam AI platform with LangChain"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AMRIT SHANKAR DUTTA"}
]
keywords = ["sarvam", "langchain", "ai", "voice", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/AmritSDutta/sarvam_lanchchain_integration"
Repository = "https://github.com/AmritSDutta/sarvam_lanchchain_integration"

dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "sarvamai==0.1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make real API calls (deselect with '-m \"not integration\"')"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true